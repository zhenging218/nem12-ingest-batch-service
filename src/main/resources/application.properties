spring.application.name=nem12-ingest-batch-service
# --- DataSource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/mydb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=admin
spring.datasource.password=passadmin

# --- JPA / Hibernate Settings ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# --- Spring Batch Metadata Tables ---
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# --- nem12 ingest properties ---
flo.nem12.ingest.staging.target=file-system-local
flo.nem12.ingest.staging.file-system-local.location=./staging
flo.nem12.ingest.staging.file-system-local.location.auto-create=true
flo.nem12.ingest.staging.file-system-local.location.poll-rate-millis=1000
flo.nem12.ingest.staging.file-system-local.pattern=*.csv

flo.nem12.ingest.archive.target=file-system-local
flo.nem12.ingest.archive.file-system-local.location=./archive
flo.nem12.ingest.archive.file-system-local.location.auto-create=true

flo.nem12.ingest.chunk-size=100
flo.nem12.ingest.line.delimiter=,

flo.nem12.meter-reading.commit.chunk-size=${flo.nem12.ingest.chunk-size}

flo.nem12.ingest.job.name=ingestJob
flo.nem12.ingest.step.name=ingestStep
flo.nem12.ingest.init.step.name=ingestInitStep
flo.nem12.housekeep.step.name=housekeepStep